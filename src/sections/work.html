<!-- WORK -->
<section id="work" class="section" style="background:var(--ink-2);">
  <div class="work-head rv">
    <div>
      <div class="label">Our Work</div>
      <h2 class="display rv d1">Selected <em>Projects</em></h2>
    </div>
    <div class="work-filters">
      <button class="wf on" type="button" data-work-filter="all">All</button>
      <button class="wf" type="button" data-work-filter="btl">BTL</button>
      <button class="wf" type="button" data-work-filter="events">Events</button>
      <button class="wf" type="button" data-work-filter="branding">Branding</button>
      <button class="wf" type="button" data-work-filter="print">Print</button>
    </div>
  </div>

  <button class="work-back" type="button" id="workBack" hidden>Back to folders</button>
  <p class="content-status work-status" aria-live="polite">Loading selected projects&hellip;</p>
  <div class="work-grid" id="wGrid" aria-live="polite"></div>
</section>
